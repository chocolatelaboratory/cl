<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff}.c{position:relative;overflow:hidden;color:#1d2147;font-family:Inter,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}.t{position:absolute;z-index:2}
.n{font-family:'Cormorant Garamond',serif;font-weight:300;letter-spacing:.05em;line-height:1}
.cap{letter-spacing:.45em;text-transform:uppercase;font-weight:300;color:#5d6398}
.rule{height:1px;background:linear-gradient(90deg,rgba(93,99,152,.5),transparent)}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const R=(a,b)=>a+Math.random()*(b-a);
function bg(w,h,X,Y,r){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fbfaff');g.addColorStop(.55,'#eef0fb');g.addColorStop(1,'#f7eef8');x.fillStyle=g;x.fillRect(0,0,w,h);
 g=x.createRadialGradient(X,Y,0,X,Y,r*3);g.addColorStop(0,'rgba(190,195,255,.5)');g.addColorStop(.45,'rgba(240,210,245,.25)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
 // beam
 {const b=document.createElement('canvas');b.width=w;b.height=h;const bx=b.getContext('2d');bx.translate(X,0);let bg2=bx.createLinearGradient(-r*.7,0,r*.7,0);bg2.addColorStop(0,'rgba(255,255,255,0)');bg2.addColorStop(.5,'rgba(255,255,255,.9)');bg2.addColorStop(1,'rgba(255,255,255,0)');bx.fillStyle=bg2;bx.beginPath();bx.moveTo(-r*.25,0);bx.lineTo(r*.25,0);bx.lineTo(r*.8,Y+r*.6);bx.lineTo(-r*.8,Y+r*.6);bx.fill();
 bx.setTransform(1,0,0,1,0,0);bx.globalCompositeOperation='destination-in';const vg=bx.createLinearGradient(0,0,0,Y+r*.6);vg.addColorStop(0,'#000');vg.addColorStop(.5,'rgba(0,0,0,.8)');vg.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=vg;bx.fillRect(0,0,w,h);x.drawImage(b,0,0)}
 // rainbow caustic pool under orb (light through glass)
 const py=Y+r*1.18;x.save();x.translate(X,py);x.scale(1,.2);x.filter=`blur(${r*.06}px)`;
 const cg=x.createConicGradient(0,0,0);['#ff7ac8','#ffb36b','#fff07a','#7affc1','#6fd3ff','#9b7bff','#ff7ac8'].forEach((c,i,a)=>cg.addColorStop(i/(a.length-1),c));
 x.globalAlpha=.55;x.fillStyle=cg;x.beginPath();x.arc(0,0,r*.85,0,7);x.arc(0,0,r*.35,0,7,true);x.fill();
 x.globalAlpha=1;g=x.createRadialGradient(0,0,0,0,0,r*.45);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,r*.5,0,7);x.fill();
 x.filter=`blur(${r*.12}px)`;g=x.createRadialGradient(0,0,r*.6,0,0,r*1.2);g.addColorStop(0,'rgba(160,140,240,.18)');g.addColorStop(1,'rgba(160,140,240,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,r*1.2,0,7);x.fill();x.restore();
 for(let i=0;i<160;i++){const a=R(0,6.28),d=r*R(1.2,3.5);x.fillStyle=`rgba(${Math.random()<.5?'150,140,230':'230,160,220'},${R(.15,.5)})`;x.beginPath();x.arc(X+Math.cos(a)*d,Y+Math.sin(a)*d,R(.5,1.8),0,7);x.fill()}
 // dust in beam
 for(let i=0;i<90;i++){x.fillStyle=`rgba(255,255,255,${R(.4,1)})`;x.beginPath();x.arc(X+R(-r*.5,r*.5),R(0,Y),R(.6,2),0,7);x.fill()}
 return c}
function ribbonGeo(r,phase,tilt,width){const N=240,pos=[],col=[],idx=[];const cols=[new THREE.Color('#ff4fb4'),new THREE.Color('#8f5cff'),new THREE.Color('#2fbfff'),new THREE.Color('#ff9ad8')];
 for(let i=0;i<=N;i++){const t=i/N,xx=-.97+t*1.94;const lim=Math.sqrt(Math.max(0,1-xx*xx))*.92;
  const cy=Math.sin(t*5+phase)*.2+tilt,cz=Math.cos(t*4+phase)*.25*lim;const wd=width*Math.sin(t*Math.PI)*(1+.5*Math.sin(t*9+phase));
  for(const sd of[-1,1]){let y=cy+wd*sd*.5;y=Math.max(-lim,Math.min(lim,y));pos.push(xx,y,cz+sd*wd*.3);const k=(t*2.2+phase*.4)%4,i0=Math.floor(k),f=k-i0;const c=cols[i0%4].clone().lerp(cols[(i0+1)%4],f);col.push(c.r,c.g,c.b)}
  if(i<N){const b=i*2;idx.push(b,b+1,b+2,b+1,b+3,b+2)}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);return g}
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=THREE.SRGBColorSpace;
const pmrem=new THREE.PMREMGenerator(renderer);
function envTex(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#f1eeff');g.addColorStop(.6,'#e6dcfb');g.addColorStop(1,'#f8eaf4');x.fillStyle=g;x.fillRect(0,0,1024,512);
 // softbox windows
 x.fillStyle='#ffffff';[[150,90,180,120],[620,70,260,90],[820,260,120,160]].forEach(([a,b,c2,d])=>{x.filter='blur(6px)';x.fillRect(a,b,c2,d)});
 x.filter='blur(30px)';[['#ffb6e6',300,300],['#a6e6ff',520,320],['#c4b0ff',760,330]].forEach(([c2,a,b])=>{x.fillStyle=c2;x.beginPath();x.arc(a,b,80,0,7);x.fill()});
 const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;return pmrem.fromEquirectangular(t).texture}
const env=envTex();
function mk(id,W,H,ox,oy,or,html){const el=document.createElement('div');el.className='c';el.id=id;el.style.cssText=`width:${W}px;height:${H}px`;const out=document.createElement('canvas');el.appendChild(out);document.body.appendChild(el);
 const s=2,w=W*s,h=H*s,X=w*ox,Y=h*oy,r=h*or;out.width=w;out.height=h;
 const bgc=bg(w,h,X,Y,r);const tex=new THREE.CanvasTexture(bgc);tex.colorSpace=THREE.SRGBColorSpace;
 renderer.setPixelRatio(1);renderer.setSize(w,h,false);
 const scene=new THREE.Scene();scene.background=tex;scene.environment=env;
 const cam=new THREE.OrthographicCamera(0,w,0,-h,-5000,5000);cam.position.z=2000;
 const grp=new THREE.Group();grp.position.set(X,-Y,0);grp.scale.setScalar(r);scene.add(grp);
 const glass=new THREE.MeshPhysicalMaterial({color:0xf4f2ff,metalness:0,roughness:0,transparent:true,opacity:.14,iridescence:1,iridescenceIOR:1.4,iridescenceThicknessRange:[250,650],clearcoat:1,clearcoatRoughness:0,envMapIntensity:1.6,depthWrite:false,side:THREE.FrontSide});
 const back=new THREE.MeshPhysicalMaterial({color:0xe9e4ff,roughness:0,transparent:true,opacity:.22,iridescence:1,iridescenceThicknessRange:[300,700],side:THREE.BackSide,depthWrite:false,envMapIntensity:1.4});
 const sceneA=new THREE.Scene();sceneA.background=tex;const grpA=new THREE.Group();grpA.position.copy(grp.position);grpA.scale.copy(grp.scale);sceneA.add(grpA);
 const rt=new THREE.WebGLRenderTarget(w*2,h*2);rt.texture.colorSpace=THREE.SRGBColorSpace;rt.texture.generateMipmaps=false;
 const refr=new THREE.ShaderMaterial({toneMapped:false,uniforms:{t:{value:rt.texture},res:{value:new THREE.Vector2(w,h)},rpx:{value:r}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D t;uniform vec2 res;uniform float rpx;varying vec3 vN;
  vec3 smp(float ior){vec3 n=normalize(vN);vec3 d=refract(vec3(0.,0.,-1.),n,1./ior);d=refract(d,-n*vec3(1.,1.,1.),ior);
   float z=n.z;vec2 off=-n.xy*rpx*(1.-1./ior)*2.2*(0.6+0.4*z);return texture2D(t,(gl_FragCoord.xy+off)/res).rgb;}
  void main(){vec3 n=normalize(vN);float r=smp(1.45).r,g=smp(1.5).g,b=smp(1.56).b;vec3 c=vec3(r,g,b);
   float e=1.-n.z;c=mix(c,vec3(.93,.92,1.),.06+.25*pow(e,3.));c*=1.0+.06*n.y;
   gl_FragColor=vec4(c,1.);
   #include <colorspace_fragment>
  }`});
 const rs=new THREE.Mesh(new THREE.SphereGeometry(1,160,120),refr);rs.renderOrder=5;grp.add(rs);
 const fm=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),glass);fm.renderOrder=20;
 const rim=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.NormalBlending,uniforms:{},vertexShader:'varying vec3 n;varying vec3 v;void main(){n=normalize(normalMatrix*normal);vec4 p=modelViewMatrix*vec4(position,1.);v=normalize(-p.xyz);gl_Position=projectionMatrix*p;}',
  fragmentShader:'varying vec3 n;varying vec3 v;void main(){float e=1.-abs(n.z);float f=pow(e,2.2)*.75+smoothstep(.9,1.,e)*.3;vec3 c=mix(vec3(.95,.55,.85),vec3(.45,.7,1.),n.y*.5+.5);c=mix(c,vec3(.55,.5,.95),smoothstep(.2,-.8,n.y)*.5);float sh=smoothstep(.3,-1.,n.y)*.18*(1.-e);gl_FragColor=vec4(mix(c,vec3(.6,.55,.9),sh),max(f,sh));}'});
 const rmM=new THREE.Mesh(new THREE.SphereGeometry(1.001,128,96),rim);rmM.renderOrder=21;grp.add(rmM);
 const rm=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false,depthTest:false});
 [[0,.0,.36,.35],[.5,.03,.22,.5],[1.0,-.03,.13,.7],[1.6,.05,.06,.9],[2.4,-.06,.03,.8]].forEach(([p,t,wd,op])=>{const mm=rm.clone();mm.opacity=op;mm.depthTest=true;mm.depthWrite=true;mm.side=THREE.DoubleSide;const m=new THREE.Mesh(ribbonGeo(1,p,t,wd),mm);m.rotation.set(.15,0,-.14);grpA.add(m)});
 // soft specular highlight
 const hc=document.createElement('canvas');hc.width=hc.height=256;const hx=hc.getContext('2d');const hg=hx.createRadialGradient(128,128,0,128,128,128);hg.addColorStop(0,'rgba(255,255,255,1)');hg.addColorStop(.35,'rgba(255,255,255,.45)');hg.addColorStop(1,'rgba(255,255,255,0)');hx.fillStyle=hg;hx.fillRect(0,0,256,256);
 const hs=new THREE.Mesh(new THREE.PlaneGeometry(.75,.36),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(hc),transparent:true,depthTest:false,depthWrite:false}));hs.position.set(-.38,.5,1.1);hs.rotation.z=.6;hs.renderOrder=30;grp.add(hs);
 const hs2=hs.clone();hs2.scale.set(.25,.25,1);hs2.position.set(.42,-.55,1.1);hs2.material=hs.material.clone();hs2.material.opacity=.5;grp.add(hs2);
 const soft=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.7,side:THREE.DoubleSide,depthWrite:false,depthTest:false});
 
 renderer.setRenderTarget(rt);renderer.render(sceneA,cam);renderer.setRenderTarget(null);
 renderer.render(scene,cam);rt.dispose();
 const x=out.getContext('2d');x.drawImage(renderer.domElement,0,0);
 const d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*10;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}x.putImageData(d,0,0);
 if(html)el.insertAdjacentHTML('beforeend',html);tex.dispose()}
const L=s=>`<div class="n" style="font-size:${s}px">Lucian <i>Vox</i></div>`;
const TAG='Lighting your digital pathway';
mk('banner_large',1680,420,.74,.44,.31,`<div class="t" style="left:120px;top:140px">${L(82)}<div class="rule" style="width:300px;margin:22px 0 18px"></div><div class="cap" style="font-size:13px">${TAG}</div></div>`);
mk('banner_mini',600,150,.8,.44,.3,`<div class="t" style="left:46px;top:46px">${L(36)}<div class="cap" style="font-size:7px;margin-top:12px">${TAG}</div></div>`);
mk('icon',500,500,.5,.44,.3,'');
mk('icon_mono',500,500,.5,.46,.32,`<div class="t n" style="left:0;right:0;top:${500*.46-64}px;text-align:center;font-size:128px;color:#fff;text-shadow:0 0 10px rgba(90,70,200,.9),0 0 30px rgba(120,90,230,.7)"><i>V</i></div>`);
mk('social_header',750,250,.5,.38,.24,`<div class="t" style="width:100%;bottom:20px;text-align:center"><div class="n" style="font-size:30px">Lucian <i>Vox</i></div><div class="cap" style="font-size:8px;margin-top:8px">${TAG}</div></div>`);
window.DONE=1;
</script></body></html>
