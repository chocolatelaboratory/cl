<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff}.c{position:relative;overflow:hidden;color:#1d2147;font-family:Inter,sans-serif;background:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%}.t{position:absolute;z-index:2}
.n{font-family:'Cormorant Garamond',serif;font-weight:300;letter-spacing:.05em;line-height:1}
.cap{letter-spacing:.45em;text-transform:uppercase;font-weight:300;color:#7a7f9a}
.rule{height:1px;background:linear-gradient(90deg,rgba(120,125,150,.5),transparent)}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=THREE.SRGBColorSpace;
const pmrem=new THREE.PMREMGenerator(renderer);const env=pmrem.fromScene(new RoomEnvironment(),.02).texture;
// swirled sphere: displace along normal with diagonal flowing folds
function swirlSphere(){const g=new THREE.SphereGeometry(1,500,380);const p=g.attributes.position,v=new THREE.Vector3();
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
  const A=new THREE.Vector3(.55,.83,.1).normalize();const lat=v.dot(A);
  const B=new THREE.Vector3(0,0,1).cross(A).normalize(),C=A.clone().cross(B);const lon=Math.atan2(v.dot(C),v.dot(B));
  const ph=lat*15+Math.sin(lon*1.3)*.9+lon*.35;
  let d=Math.pow(.5+.5*Math.sin(ph),2.5)-.3;
  const fade=Math.max(0,Math.min(1,.4+.9*(v.z*.7+v.x*.3)));
  v.multiplyScalar(1+d*.018*fade);p.setXYZ(i,v.x,v.y,v.z)}
 g.computeVertexNormals();return g}
function mk(id,W,H,ox,oy,or,glow,html){const el=document.createElement('div');el.className='c';el.id=id;el.style.cssText=`width:${W}px;height:${H}px`;const out=document.createElement('canvas');el.appendChild(out);document.body.appendChild(el);
 const s=2,w=W*s,h=H*s,X=w*ox,Y=h*oy,r=h*or;out.width=w;out.height=h;const x=out.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,w,h);
 // contact shadow + optional rainbow glow
 x.save();x.translate(X,Y+r*1.12);x.scale(1,.18);x.filter=`blur(${r*.08}px)`;
 if(glow){const cg=x.createConicGradient(0,0,0);['#ff7ac8','#ffb36b','#fff07a','#7affc1','#6fd3ff','#9b7bff','#ff7ac8'].forEach((c,i,a)=>cg.addColorStop(i/(a.length-1),c));x.globalAlpha=.6;x.fillStyle=cg;x.beginPath();x.arc(0,0,r*.85,0,7);x.arc(0,0,r*.35,0,7,true);x.fill();x.globalAlpha=1;}
 else{const sg=x.createRadialGradient(0,0,0,0,0,r*.8);sg.addColorStop(0,'rgba(120,125,145,.22)');sg.addColorStop(1,'rgba(120,125,145,0)');x.fillStyle=sg;x.beginPath();x.arc(0,0,r*.8,0,7);x.fill();}
 x.restore();
 renderer.setPixelRatio(1);renderer.setSize(w,h,false);
 const scene=new THREE.Scene();scene.environment=env;
 const cam=new THREE.OrthographicCamera(0,w,0,-h,-5000,5000);cam.position.z=2000;
 const mat=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.3,metalness:0,clearcoat:1,clearcoatRoughness:.06,sheen:1,sheenColor:new THREE.Color('#ffffff'),sheenRoughness:.5,envMapIntensity:.8});
 const m=new THREE.Mesh(swirlSphere(),mat);m.position.set(X,-Y,0);m.scale.setScalar(r);m.rotation.set(0,0,0);scene.add(m);
 const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(-1.6,1.2,.7);scene.add(key);scene.add(new THREE.AmbientLight(0xffffff,.35));
 renderer.render(scene,cam);x.drawImage(renderer.domElement,0,0);
 if(html)el.insertAdjacentHTML('beforeend',html)}
const L=s=>`<div class="n" style="font-size:${s}px">Lucian <i>Vox</i></div>`;const TAG='Lighting your digital pathway';
const bl=`<div class="t" style="left:120px;top:140px">${L(82)}<div class="rule" style="width:300px;margin:22px 0 18px"></div><div class="cap" style="font-size:13px">${TAG}</div></div>`;
mk('w_banner_large',1680,420,.74,.46,.3,false,bl);
mk('w_banner_large_glow',1680,420,.74,.44,.3,true,bl);
mk('w_icon',500,500,.5,.48,.32,false,'');
mk('w_icon_glow',500,500,.5,.45,.3,true,'');
mk('w_banner_mini',600,150,.8,.46,.3,false,`<div class="t" style="left:46px;top:46px">${L(36)}<div class="cap" style="font-size:7px;margin-top:12px">${TAG}</div></div>`);
mk('w_social_header',750,250,.5,.4,.24,false,`<div class="t" style="width:100%;bottom:20px;text-align:center"><div class="n" style="font-size:30px">Lucian <i>Vox</i></div><div class="cap" style="font-size:8px;margin-top:8px">${TAG}</div></div>`);
window.DONE=1;
</script></body></html>
