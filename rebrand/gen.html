<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.c{position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.b{width:1680px;height:420px}.i{width:500px;height:500px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;z-index:2}
.serif{font-family:'Cormorant Garamond',serif;font-weight:300}
.cap{letter-spacing:.42em;text-transform:uppercase;font-weight:300;font-size:13px;opacity:.75}
</style></head><body>
<script>
const R=(a,b)=>a+Math.random()*(b-a);
function grain(x,w,h,a=18){const d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*a;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}x.putImageData(d,0,0)}
function mk(cls,draw,html){const el=document.createElement('div');el.className='c '+cls;const cv=document.createElement('canvas');el.appendChild(cv);document.body.appendChild(el);const w=el.clientWidth*2,h=el.clientHeight*2;cv.width=w;cv.height=h;const x=cv.getContext('2d');draw(x,w,h);grain(x,w,h);if(html)el.insertAdjacentHTML('beforeend',html);return el}
// 1 BEAM: shaft of light from above (pins: man under beam, blue spotlight, lantern)
function beam(cx,col){return (x,w,h)=>{x.fillStyle='#050608';x.fillRect(0,0,w,h);
 x.globalCompositeOperation='lighter';
 for(let i=0;i<60;i++){const a=R(-.35,.35),s=R(.01,.06);x.save();x.translate(w*cx,-20);x.rotate(a);const g=x.createLinearGradient(0,0,0,h*1.2);g.addColorStop(0,`rgba(${col},${s*3})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.moveTo(-2,0);x.lineTo(2,0);x.lineTo(R(20,90),h*1.3);x.lineTo(-R(20,90),h*1.3);x.fill();x.restore()}
 let g=x.createRadialGradient(w*cx,0,0,w*cx,0,h*.9);g.addColorStop(0,`rgba(${col},.9)`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
 for(let i=0;i<300;i++){x.fillStyle=`rgba(${col},${R(.1,.6)})`;x.beginPath();x.arc(w*cx+R(-h*.5,h*.5),R(0,h),R(.5,2),0,7);x.fill()}}}
// 2 ORB: iridescent glass sphere (pins: bubble, iridescent orb)
function orb(cx,cy,r,bg){return (x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);const X=w*cx,Y=h*cy,Rr=h*r;
 let g=x.createRadialGradient(X,Y,Rr*.8,X,Y,Rr*2.2);g.addColorStop(0,'rgba(120,140,255,.25)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.save();x.beginPath();x.arc(X,Y,Rr,0,7);x.clip();
 g=x.createRadialGradient(X-Rr*.3,Y-Rr*.4,0,X,Y,Rr);g.addColorStop(0,'rgba(240,244,255,.35)');g.addColorStop(.7,'rgba(150,170,240,.12)');g.addColorStop(1,'rgba(200,215,255,.55)');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.globalCompositeOperation='screen';[['255,140,220',.0],['120,220,255',.6],['190,160,255',1.3]].forEach(([c,o],k)=>{x.beginPath();for(let t=0;t<=1;t+=.01){const px=X-Rr+t*2*Rr,py=Y+Math.sin(t*6+o)*Rr*.18+(k-1)*Rr*.08;t?x.lineTo(px,py):x.moveTo(px,py)}x.lineWidth=Rr*.22;x.strokeStyle=`${c.length?'rgba('+c+',.8)':''}`;x.filter=`blur(${Rr*.08}px)`;x.stroke()});
 x.filter='none';x.restore();x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(X,Y,Rr,0,7);x.stroke();
 g=x.createRadialGradient(X-Rr*.35,Y-Rr*.45,0,X-Rr*.35,Y-Rr*.45,Rr*.35);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}}
// 3 PORTAL: glowing blue ring (pins: blue vortex, halo ring, iris)
function portal(cx,r){return (x,w,h)=>{x.fillStyle='#02040d';x.fillRect(0,0,w,h);const X=w*cx,Y=h/2,Rr=h*r;x.globalCompositeOperation='lighter';
 for(let i=0;i<1400;i++){const a=R(0,6.283),d=Rr*(1+(Math.random()-.5)*.35*Math.random()),s=R(1,4);x.fillStyle=`hsla(${R(205,250)},100%,${R(55,85)}%,${R(.15,.6)})`;x.beginPath();x.ellipse(X+Math.cos(a)*d,Y+Math.sin(a)*d*.95,s*4,s,a+1.57,0,7);x.fill()}
 for(let k=0;k<3;k++){x.lineWidth=R(2,6);x.strokeStyle=`rgba(140,180,255,${.4-k*.1})`;x.filter=`blur(${4+k*8}px)`;x.beginPath();x.arc(X,Y,Rr*(1+k*.02),0,7);x.stroke()}
 x.filter='blur(30px)';let g=x.createRadialGradient(X,Y,0,X,Y,Rr*.35);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(150,190,255,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);x.filter='none';
 for(let i=0;i<200;i++){x.fillStyle=`rgba(200,220,255,${R(.1,.8)})`;x.fillRect(R(0,w),R(0,h),1.5,1.5)}}}
// 4 WAVE: violet aurora (pins: purple wave, pink arc)
function wave(bg){return (x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.globalCompositeOperation='lighter';
 for(let l=0;l<70;l++){x.beginPath();const ph=R(0,1),amp=h*R(.06,.16),y0=h*R(.45,.6);for(let t=0;t<=1;t+=.005){const px=t*w,py=y0+Math.sin(t*5+ph*2)*amp*Math.sin(t*3.14);t?x.lineTo(px,py):x.moveTo(px,py)}x.lineWidth=R(.5,2);x.strokeStyle=`hsla(${R(255,300)},90%,${R(55,75)}%,${R(.08,.3)})`;x.stroke()}
 x.filter='blur(40px)';x.lineWidth=h*.12;x.strokeStyle='rgba(150,80,255,.35)';x.beginPath();for(let t=0;t<=1;t+=.01){const px=t*w,py=h*.52+Math.sin(t*5)*h*.1*Math.sin(t*3.14);t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.filter='none'}}
const name=(s=64)=>`<div class="serif" style="font-size:${s}px;letter-spacing:.06em;line-height:1">Lucian <i>Vox</i></div>`;
// banners
mk('b',beam(.72,'190,215,255'),`<div class="t" style="left:110px;top:130px">${name(78)}<div class="cap" style="margin-top:18px">Designs &nbsp;·&nbsp; your digital playbook</div></div>`).id='b1';
mk('b',orb(.78,.5,.36,'#06070f'),`<div class="t" style="left:110px;top:140px">${name(74)}<div class="cap" style="margin-top:18px">the voice of light &nbsp;—&nbsp; digital playbooks</div></div>`).id='b2';
mk('b',portal(.5,.33),`<div class="t" style="left:0;right:0;top:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:0 110px"><div class="serif" style="font-size:72px">Lucian</div><div class="serif" style="font-size:72px"><i>Vox</i></div></div><div class="t cap" style="bottom:34px;width:100%;text-align:center">designs · your digital playbook</div>`).id='b3';
mk('b',wave('#05030b'),`<div class="t" style="width:100%;top:70px;text-align:center">${name(84)}<div class="cap" style="margin-top:22px">Planners & playbooks that light the way</div></div>`).id='b4';
// icons
mk('i',beam(.5,'190,215,255'),`<div class="t serif" style="bottom:70px;width:100%;text-align:center;font-size:120px"><i>LV</i></div>`).id='i1';
mk('i',orb(.5,.5,.3,'#06070f'),``).id='i2';
mk('i',portal(.5,.3),`<div class="t serif" style="inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;text-shadow:0 0 30px #8ab"><i style="color:#02040d">V</i></div>`).id='i3';
mk('i',wave('#05030b'),`<div class="t serif" style="inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;mix-blend-mode:screen"><i>V</i></div>`).id='i4';
</script></body></html>
