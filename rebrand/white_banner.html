<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff}.c{position:relative;overflow:hidden;background:#fff;color:#1d2147;font-family:Inter,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}.t{position:absolute;z-index:2}
.n{font-family:'Cormorant Garamond',serif;font-weight:300;letter-spacing:.05em;line-height:1}
.cap{letter-spacing:.45em;text-transform:uppercase;font-weight:300;color:#5d6398}</style></head><body>
<script>
function mk(id,W,H,ox,oy,or,html){const el=document.createElement('div');el.className='c';el.id=id;el.style.cssText=`width:${W}px;height:${H}px`;const cv=document.createElement('canvas');el.appendChild(cv);document.body.appendChild(el);
 const s=2,w=W*s,h=H*s,X=w*ox,Y=h*oy,r=h*or;cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
 x.save();x.translate(X,Y+r*1.18);x.scale(1,.2);x.filter=`blur(${r*.06}px)`;
 const cg=x.createConicGradient(0,0,0);['#ff7ac8','#ffb36b','#fff07a','#7affc1','#6fd3ff','#9b7bff','#ff7ac8'].forEach((c,i,a)=>cg.addColorStop(i/(a.length-1),c));
 x.globalAlpha=.75;x.fillStyle=cg;x.beginPath();x.arc(0,0,r*.85,0,7);x.arc(0,0,r*.35,0,7,true);x.fill();x.restore();
 el.insertAdjacentHTML('beforeend',html)}
const L=s=>`<div class="n" style="font-size:${s}px">Lucian <i>Vox</i></div>`,TAG='Lighting your digital pathway';
mk('white_banner_mini',600,150,.8,.44,.3,`<div class="t" style="left:46px;top:46px">${L(36)}<div class="cap" style="font-size:7px;margin-top:12px">${TAG}</div></div>`);
mk('white_banner_large',1680,420,.74,.44,.31,`<div class="t" style="left:120px;top:140px">${L(82)}<div class="cap" style="font-size:13px;margin-top:40px">${TAG}</div></div>`);
</script></body></html>
